kind = "web"
previewPath = "/"
title = "Sudoku Game"
version = "1.0.0"
id = "artifacts/sudoku-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19093

[services.development]
run = "pnpm --filter @workspace/sudoku-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sudoku-game", "run", "build" ]
publicDir = "artifacts/sudoku-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/"
to = "/index.html"

[[services.production.rewrites]]
from = "/guides"
to = "/guides/index.html"

[[services.production.rewrites]]
from = "/guides/"
to = "/guides/index.html"

[[services.production.rewrites]]
from = "/sudoku"
to = "/sudoku/index.html"

[[services.production.rewrites]]
from = "/sudoku/"
to = "/sudoku/index.html"

[[services.production.rewrites]]
from = "/memory"
to = "/memory/index.html"

[[services.production.rewrites]]
from = "/memory/"
to = "/memory/index.html"

[[services.production.rewrites]]
from = "/daily-challenge"
to = "/daily-challenge/index.html"

[[services.production.rewrites]]
from = "/daily-challenge/"
to = "/daily-challenge/index.html"

[[services.production.rewrites]]
from = "/leaderboard"
to = "/leaderboard/index.html"

[[services.production.rewrites]]
from = "/leaderboard/"
to = "/leaderboard/index.html"

[[services.production.rewrites]]
from = "/challenges"
to = "/challenges/index.html"

[[services.production.rewrites]]
from = "/challenges/"
to = "/challenges/index.html"

[[services.production.rewrites]]
from = "/about"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/about/"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy/index.html"

[[services.production.rewrites]]
from = "/privacy/"
to = "/privacy/index.html"

[[services.production.rewrites]]
from = "/terms"
to = "/terms/index.html"

[[services.production.rewrites]]
from = "/terms/"
to = "/terms/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19093"
BASE_PATH = "/"

openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sudoku Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: puzzles
    description: Puzzle generation and retrieval
  - name: games
    description: Game session management
  - name: leaderboard
    description: Leaderboard and scores
  - name: stats
    description: Player statistics
  - name: tournaments
    description: Weekly and monthly tournaments
  - name: badges
    description: Achievement badges
  - name: challenges
    description: Player vs Player challenges
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profiles:
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Create a user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/sync:
    post:
      operationId: syncProfile
      tags: [profiles]
      summary: Find or create a profile by Clerk user ID or device ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSync"
      responses:
        "200":
          description: Profile found or created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update a user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /puzzles/new:
    get:
      operationId: generatePuzzle
      tags: [puzzles]
      summary: Generate a new Sudoku puzzle
      parameters:
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
            enum: [easy, medium, hard, expert]
            default: medium
        - name: gridSize
          in: query
          required: false
          schema:
            type: integer
            enum: [3, 4, 6, 9, 16]
            default: 9
      responses:
        "200":
          description: A new puzzle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Puzzle"

  /puzzles/{id}:
    get:
      operationId: getPuzzle
      tags: [puzzles]
      summary: Get a specific puzzle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Puzzle"
        "404":
          description: Not found

  /games:
    post:
      operationId: createGame
      tags: [games]
      summary: Start a new game session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "201":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: saveGame
      tags: [games]
      summary: Save game progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameProgress"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}/complete:
    post:
      operationId: completeGame
      tags: [games]
      summary: Mark a game as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCompletion"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top scores leaderboard
      parameters:
        - name: gridSize
          in: query
          required: false
          schema:
            type: integer
            enum: [3, 4, 6, 9, 16]
            default: 9
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /stats/{profileId}:
    get:
      operationId: getPlayerStats
      tags: [stats]
      summary: Get player statistics
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"

  /tournaments/leaderboard:
    get:
      operationId: getTournamentLeaderboard
      tags: [tournaments]
      summary: Get weekly or monthly tournament leaderboard
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [weekly, monthly]
            default: weekly
        - name: gridSize
          in: query
          required: false
          schema:
            type: integer
            enum: [3, 4, 6, 9, 16]
        - name: period
          in: query
          required: false
          schema:
            type: string
            description: "Period string e.g. 2026-W23 or 2026-06 (defaults to current)"
      responses:
        "200":
          description: Tournament leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentLeaderboard"

  /badges/share/{token}:
    get:
      operationId: getBadgeShare
      tags: [badges]
      summary: Get public badge info by share token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Badge share info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeShare"
        "404":
          description: Not found

  /badges/{profileId}:
    get:
      operationId: getProfileBadges
      tags: [badges]
      summary: Get badges earned by a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  /challenges:
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Create a new challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInput"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"

  /challenges/for/{profileId}:
    get:
      operationId: getChallengesForProfile
      tags: [challenges]
      summary: Get all challenges for a profile (incoming and outgoing)
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeDetail"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get a specific challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Challenge detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "404":
          description: Not found

  /challenges/{id}/respond:
    patch:
      operationId: respondToChallenge
      tags: [challenges]
      summary: Accept or decline a challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeResponse"
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "404":
          description: Not found

  /profiles/search:
    get:
      operationId: searchProfiles
      tags: [profiles]
      summary: Search profiles by username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: exclude
          in: query
          required: false
          schema:
            type: integer
          description: Profile ID to exclude from results
      responses:
        "200":
          description: Matching profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Profile:
      type: object
      required: [id, username, theme, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        avatar:
          type: ["string", "null"]
        theme:
          type: string
          description: "Selected colour theme for this user's profile"
        imageTheme:
          type: string
          description: "Selected game icon set for this user's profile"
        fontTheme:
          type: string
          description: "Selected font theme for this user's profile"
        fontSize:
          type: string
          enum: [small, default, large, extra-large]
          description: "Selected interface font size for this user's profile"
        backgroundEnabled:
          type: boolean
          description: "Whether the background image is enabled for this user's profile"
        highlightErrors:
          type: boolean
        showTimer:
          type: boolean
        soundEnabled:
          type: boolean
        gameMode:
          type: string
          enum: ["children", "adult", "4all"]
        gems:
          type: integer
          description: "Accumulated gem balance usable for future in-game features"
        xp:
          type: integer
          description: "Experience points accumulated from completing games"
        createdAt:
          type: string

    ProfileInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
        avatar:
          type: string
        theme:
          type: string
          description: "Selected colour theme for this user's profile"
        imageTheme:
          type: string
        fontTheme:
          type: string
        fontSize:
          type: string
          enum: [small, default, large, extra-large]
        backgroundEnabled:
          type: boolean
        highlightErrors:
          type: boolean
        showTimer:
          type: boolean

    ProfileUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
        avatar:
          type: string
        theme:
          type: string
          description: "Selected colour theme for this user's profile"
        imageTheme:
          type: string
        fontTheme:
          type: string
        fontSize:
          type: string
          enum: [small, default, large, extra-large]
        backgroundEnabled:
          type: boolean
        highlightErrors:
          type: boolean
        showTimer:
          type: boolean
        soundEnabled:
          type: boolean
        gameMode:
          type: string
          enum: ["children", "adult", "4all"]

    ProfileSync:
      type: object
      properties:
        clerkUserId:
          type: string
        deviceId:
          type: string
        username:
          type: string
        avatar:
          type: string

    Puzzle:
      type: object
      required: [id, difficulty, gridSize, grid, solution]
      properties:
        id:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard, expert]
        gridSize:
          type: integer
          enum: [3, 4, 6, 9, 16]
        grid:
          type: string
          description: "gridSize*gridSize character string, 0 = empty; 16x16 uses hex chars (a-g for 10-16)"
        solution:
          type: string
        createdAt:
          type: string

    Game:
      type: object
      required: [id, puzzleId, status, currentGrid, elapsedSeconds, mistakeCount, createdAt]
      properties:
        id:
          type: integer
        profileId:
          type: ["integer", "null"]
        puzzleId:
          type: integer
        puzzle:
          $ref: "#/components/schemas/Puzzle"
        status:
          type: string
          enum: [active, completed, abandoned]
        currentGrid:
          type: string
        elapsedSeconds:
          type: integer
        mistakeCount:
          type: integer
        hintsUsed:
          type: integer
        points:
          type: ["integer", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    GameInput:
      type: object
      required: [puzzleId]
      properties:
        profileId:
          type: integer
        puzzleId:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard, expert]

    GameProgress:
      type: object
      properties:
        currentGrid:
          type: string
        elapsedSeconds:
          type: integer
        mistakeCount:
          type: integer
        hintsUsed:
          type: integer

    GameCompletion:
      type: object
      required: [elapsedSeconds]
      properties:
        elapsedSeconds:
          type: integer
        mistakeCount:
          type: integer
        hintsUsed:
          type: integer

    LeaderboardEntry:
      type: object
      required: [rank, profileId, username, elapsedSeconds, completedAt]
      properties:
        rank:
          type: integer
        profileId:
          type: integer
        username:
          type: string
        avatar:
          type: ["string", "null"]
        difficulty:
          type: string
          enum: [easy, medium, hard, expert]
        gridSize:
          type: integer
          enum: [3, 4, 6, 9, 16]
        elapsedSeconds:
          type: integer
        mistakeCount:
          type: integer
        completedAt:
          type: string
        xp:
          type: integer
          description: "Experience points of the player at the time of the entry"
        xpEarned:
          type: integer
          description: "XP earned for this game (or total XP earned across games, for aggregate views)"

    PlayerStats:
      type: object
      required: [profileId, totalGames, totalWins, bestTimes]
      properties:
        profileId:
          type: integer
        totalGames:
          type: integer
        totalWins:
          type: integer
        winRate:
          type: number
        bestTimes:
          type: object
          properties:
            easy:
              type: ["integer", "null"]
            medium:
              type: ["integer", "null"]
            hard:
              type: ["integer", "null"]
            expert:
              type: ["integer", "null"]
        averageTime:
          type: ["integer", "null"]
        totalMistakes:
          type: integer
        currentStreak:
          type: integer
        memory:
          type: object
          properties:
            totalGames:
              type: integer
            totalWins:
              type: integer
            winRate:
              type: number
            bestTimes:
              type: object
              additionalProperties:
                type: ["integer", "null"]
            averageTime:
              type: ["integer", "null"]
            averageFlips:
              type: ["integer", "null"]
            currentStreak:
              type: integer
            longestStreak:
              type: integer

    TournamentEntry:
      type: object
      required: [rank, profileId, username, totalPoints, gamesPlayed]
      properties:
        rank:
          type: integer
        profileId:
          type: integer
        username:
          type: string
        avatar:
          type: ["string", "null"]
        totalPoints:
          type: integer
        gamesPlayed:
          type: integer
        xp:
          type: integer
          description: "Player's total profile XP (used to derive their rank tier, e.g. Iron/Silver/Gold)"

    TournamentLeaderboard:
      type: object
      required: [period, periodLabel, type, entries]
      properties:
        period:
          type: string
        periodLabel:
          type: string
        type:
          type: string
          enum: [weekly, monthly]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TournamentEntry"

    Badge:
      type: object
      required: [id, profileId, badgeType, tournamentPeriod, totalPoints, shareToken, awardedAt]
      properties:
        id:
          type: integer
        profileId:
          type: integer
        badgeType:
          type: string
        tournamentPeriod:
          type: string
        totalPoints:
          type: integer
        shareToken:
          type: string
        awardedAt:
          type: string

    BadgeShare:
      type: object
      required: [id, badgeType, tournamentPeriod, totalPoints, shareToken, awardedAt, username]
      properties:
        id:
          type: integer
        badgeType:
          type: string
        tournamentPeriod:
          type: string
        totalPoints:
          type: integer
        shareToken:
          type: string
        awardedAt:
          type: string
        username:
          type: string
        avatar:
          type: ["string", "null"]

    ProfileSummary:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
        avatar:
          type: ["string", "null"]
        gems:
          type: integer

    ChallengeInput:
      type: object
      required: [challengerId, challengedId, difficulty, gridSize]
      properties:
        challengerId:
          type: integer
        challengedId:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard, expert]
        gridSize:
          type: integer
          enum: [3, 4, 6, 9, 16]

    ChallengeResponse:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, decline]
        profileId:
          type: integer

    ChallengeDetail:
      type: object
      required: [id, challengerId, challengedId, puzzleId, status, createdAt, challengerUsername, challengedUsername]
      properties:
        id:
          type: integer
        challengerId:
          type: integer
        challengedId:
          type: integer
        puzzleId:
          type: integer
        status:
          type: string
          enum: [pending, accepted, declined, completed]
        challengerGameId:
          type: ["integer", "null"]
        challengedGameId:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        challengerUsername:
          type: string
        challengedUsername:
          type: string
        challengerAvatar:
          type: ["string", "null"]
        challengedAvatar:
          type: ["string", "null"]
        challengerPoints:
          type: ["integer", "null"]
        challengedPoints:
          type: ["integer", "null"]
        difficulty:
          type: string
          enum: [easy, medium, hard, expert]
        gridSize:
          type: integer
          enum: [3, 4, 6, 9, 16]
        createdAt:
          type: string
